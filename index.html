<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071226"><title>Kontakti Mobiili · Opero</title><style>html,body{min-height:100%;margin:0;background:#020b1c;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.splash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(30,100,255,.12),transparent 30%),linear-gradient(180deg,#03122c 0%,#020b1c 100%)}.shell{display:flex;flex-direction:column;align-items:center;gap:18px;animation:rise 1.1s ease forwards;opacity:0;transform:translateY(6px) scale(.985)}.logo{font-size:54px;font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 18px 34px rgba(0,0,0,.38),0 0 24px rgba(45,107,255,.32)}.line{width:180px;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,#39a0ff,transparent);box-shadow:0 0 14px rgba(57,160,255,.45)}.product{font-size:24px;font-weight:700;letter-spacing:.20em;color:#fff;text-transform:uppercase}.loading{font-size:15px;color:rgba(236,242,255,.88);margin-top:84px}.err{display:none;max-width:360px;color:#ffb5c0;white-space:pre-wrap;text-align:left;background:rgba(255,95,122,.12);border:1px solid rgba(255,95,122,.25);border-radius:16px;padding:12px;margin-top:12px}@keyframes rise{to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:680px){.logo{font-size:44px}.product{font-size:20px}.loading{margin-top:66px}}</style></head><body><div class="splash"><div class="shell"><div class="logo">OPERO</div><div class="line"></div><div class="product">Kontakti-mobiili</div><div class="loading">Ladataan...</div><div id="err" class="err"></div></div></div><script>(async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));const source='https://raw.githubusercontent.com/Hekse/kontakti-mobile/2d30785a5cdff1ff49dd165142a6aad280932abe/index.html?cb='+Date.now();const css=`
.field{background:#10233d!important;border:1px solid rgba(190,215,255,.42)!important;border-radius:18px!important;padding:12px 13px!important}.field label{color:#dbe8ff!important;font-size:11px!important;margin-bottom:8px!important;display:block!important;letter-spacing:.10em!important;font-weight:700!important}.field input,.field textarea,.field select{display:block!important;width:100%!important;min-height:46px!important;background:#071226!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border:1px solid rgba(190,215,255,.30)!important;border-radius:13px!important;padding:10px 12px!important;font-size:16px!important;font-weight:600!important;opacity:1!important}.field textarea{min-height:94px!important;font-weight:500!important}.field select{appearance:none!important;-webkit-appearance:none!important;background-image:linear-gradient(45deg,transparent 50%,#eef4ff 50%),linear-gradient(135deg,#eef4ff 50%,transparent 50%)!important;background-position:calc(100% - 18px) 19px,calc(100% - 12px) 19px!important;background-size:6px 6px,6px 6px!important;background-repeat:no-repeat!important;padding-right:36px!important}.field select option,select option{background:#071226!important;color:#fff!important}.btn,.card-title,.customer-name,.title{font-weight:700!important}.sync-box{border:1px solid rgba(190,215,255,.24);background:rgba(78,158,255,.08);border-radius:18px;padding:12px;margin:10px 0}input[type=date]{color-scheme:dark!important}input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)!important;opacity:1!important;background-color:rgba(78,158,255,.28)!important;border-radius:8px!important;padding:5px!important}
`;const js=`<script>
(function(){
 const META='kontakti_mobile_sync_meta_v1';
 function meta(){try{return JSON.parse(localStorage.getItem(META)||'{"pending":0,"changed":[]}')}catch(e){return {pending:0,changed:[]}}}
 function setMeta(m){localStorage.setItem(META,JSON.stringify(m));updateSyncUi()}

 window.renderCustomers=function(){const input=document.getElementById('searchInput');const target=document.getElementById('customersList');if(!target)return;const q=(input&&input.value?input.value:'').trim().toLowerCase();const all=sortSmart(activeCustomers());const list=(q?all.filter(c=>[c.name,c.city,c.business_id,c.address,c.phone].join(' ').toLowerCase().includes(q)).slice(0,25):all.slice(0,5));const help=q?'Hakutuloksia näytetään enintään 25.':'Näytetään 5 asiakasta. Hae loput nimellä, kaupungilla tai Y-tunnuksella.';target.innerHTML='<div class="small" style="margin:0 2px 10px">'+help+'</div>'+(list.map(customerCard).join('')||'<div class="empty">Ei osumia.</div>')};
 function tuneEntryForm(){const form=document.querySelector('#entry .form');if(!form||document.getElementById('nextActionType'))return;const first=form.querySelector('.field label');if(first)first.textContent='Tapahtuma nyt';const date=document.getElementById('entryNext')?.closest('.field');if(date){date.insertAdjacentHTML('beforebegin','<div class="field"><label>Seuraava toimenpide</label><select id="nextActionType"><option>Soitto</option><option>Tapaaminen</option><option>Sähköposti</option><option>Tarjous</option><option>Seuranta</option><option>Muu</option></select></div><div class="field"><label>Seuraavan toimenpiteen syy / aihe</label><input id="nextActionReason" placeholder="esim. kysy hanatuotteista"></div>');}const dl=date?.querySelector('label');if(dl)dl.textContent='Seuraavan toimenpiteen päivä'}
 window.saveEntry=function(){const c=byId(currentId);if(!c)return;const eventType=document.getElementById('entryType').value;const note=document.getElementById('entryNote').value||eventType;const nextType=document.getElementById('nextActionType')?.value||eventType;const reason=(document.getElementById('nextActionReason')?.value||'').trim();const nextDate=document.getElementById('entryNext').value;c.notes=[{date:TODAY,type:eventType,text:note},...(c.notes||[])];c.next_action=reason?nextType+' · '+reason:nextType;if(nextDate)c.next_date=nextDate;c.priority=document.getElementById('entryPrio').value==='1';c.done=true;c.meeting=eventType==='Tapaaminen'||nextType==='Tapaaminen';saveCustomers();flag(c.id);toast('Merkintä tallennettu');openScreen('detail')};
 const oldOpenEntry=window.openEntry;window.openEntry=function(id){oldOpenEntry(id);tuneEntryForm();forceFields()};
 const oldAdd=window.addCustomer;window.addCustomer=function(){oldAdd();flag(currentId)};const oldDone=window.markDone;window.markDone=function(id){oldDone(id);flag(id)};const oldUndone=window.unmarkDone;window.unmarkDone=function(id){oldUndone(id);flag(id)};const oldPrio=window.togglePriority;window.togglePriority=function(id){oldPrio(id);flag(id)};
 window.exportMobileChanges=function(){const m=meta();const ids=m.changed||[];const data=customers.filter(c=>ids.includes(c.id)||ids.includes(c.customer_id));const out={schema:'kontakti-mobile-changes-v1',source:'kontakti-mobile',exported_at:new Date().toISOString(),changes:data};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kontakti_mobiilimuutokset_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Mobiilimuutokset viety')};
 window.clearMobileChanges=function(){if(confirm('Merkitäänkö mobiilimuutokset viedyiksi?'))setMeta({pending:0,changed:[],updated_at:new Date().toISOString()})};
 function addSyncUi(){const s=document.getElementById('settings');if(!s||document.getElementById('syncPendingText'))return;const card=s.querySelector('.card .list');if(!card)return;card.insertAdjacentHTML('afterbegin','<div class="sync-box"><div class="card-title">Mobiilimuutokset</div><div class="muted" id="syncPendingText">0 muutosta odottaa vientiä</div></div><button class="btn primary full" onclick="exportMobileChanges()">Vie mobiilimuutokset</button><button class="btn full" onclick="clearMobileChanges()">Merkitse viedyiksi</button>');updateSyncUi()}
 forceFields();addSyncUi();render();
})();<\/script>`;try{const [html]=await Promise.all([fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}),wait(2300)]);const out=html.replace('</style>',css+'</style>').replace('</body>',js+'</body>');document.open();document.write(out);document.close()}catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Lataus epäonnistui: '+e.message+'\nPäivitä sivu tai avaa hetken päästä uudelleen.'}})();</script></body></html>
