<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071226"><title>Kontakti Mobiili · Opero</title><style>html,body{min-height:100%;margin:0;background:#020b1c;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.blank{position:fixed;inset:0;background:linear-gradient(180deg,#03122c,#020b1c)}.err{display:none;position:fixed;left:16px;right:16px;top:16px;max-width:360px;margin:auto;color:#ffb5c0;white-space:pre-wrap;text-align:left;background:rgba(255,95,122,.12);border:1px solid rgba(255,95,122,.25);border-radius:16px;padding:12px}</style></head><body><div class="blank"><div id="err" class="err"></div></div><script>(async()=>{try{let html=await fetch('https://raw.githubusercontent.com/Hekse/kontakti-mobile/787b6130c224da0da660e89025c563e1b9266b03/index.html?cb='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});html=html.split('.opero-splash{position:fixed!important;').join('.opero-splash{visibility:hidden!important;opacity:0!important;animation:none!important}.opero-splash.fixed-splash{position:fixed!important;');html=html.split('<div class="opero-splash" id="operoSplash">').join('<div class="opero-splash fixed-splash" id="operoSplash">');html=html.split('font-weight:700!important;letter-spacing:.22em!important').join('font-weight:500!important;letter-spacing:.18em!important');document.open();document.write(html);document.close()}catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Lataus epäonnistui: '+e.message+'\nPäivitä sivu tai avaa hetken päästä uudelleen.'}})();</script></body></html>
