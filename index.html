<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071226"><title>Kontakti Mobiili · Opero</title><style>html,body{min-height:100%;margin:0;background:#020b1c;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.blank{position:fixed;inset:0;background:linear-gradient(180deg,#03122c,#020b1c)}.err{display:none;position:fixed;left:16px;right:16px;top:16px;max-width:360px;margin:auto;color:#ffb5c0;white-space:pre-wrap;text-align:left;background:rgba(255,95,122,.12);border:1px solid rgba(255,95,122,.25);border-radius:16px;padding:12px}</style></head><body><div class="blank"><div id="err" class="err"></div></div><script>(async()=>{try{let html=await fetch('https://raw.githubusercontent.com/Hekse/kontakti-mobile/6f0f8bb2026f4f83a372ef19574930999517068f/index.html?cb='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});html=html.replace('${aStyle}\n.logo','${aStyle}\n.splash-product{font-size:24px!important;font-weight:400!important;letter-spacing:.18em!important}\n.logo');document.open();document.write(html);document.close()}catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Lataus epäonnistui: '+e.message+'\nPäivitä sivu tai avaa hetken päästä uudelleen.'}})();</script></body></html>
