<style>
:root{--bg:#040a15;--phone:#071226;--card:#0d1b2f;--card2:#10233d;--line:rgba(145,180,255,.16);--line2:rgba(190,215,255,.24);--text:#eef4ff;--muted:#9db0d3;--dim:#607092;--blue:#4e9eff;--blueSoft:rgba(78,158,255,.16);--purpleSoft:rgba(159,107,255,.16);--redSoft:rgba(255,95,122,.15);--greenSoft:rgba(53,212,141,.14);--amberSoft:rgba(245,185,66,.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text)}body{display:flex;justify-content:center;background:radial-gradient(circle at 20% 0,rgba(78,158,255,.13),transparent 35%),radial-gradient(circle at 85% 0,rgba(159,107,255,.1),transparent 34%),var(--bg);padding:16px 10px}.phone{width:100%;max-width:420px;min-height:calc(100dvh - 32px);background:var(--phone);border:1px solid rgba(255,255,255,.07);border-radius:34px;box-shadow:0 22px 54px rgba(0,0,0,.38);overflow:hidden;position:relative}.screen{display:none;padding:18px 15px 26px}.screen.on{display:block}.opero-splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#03122c 0%,#020b1c 100%);animation:splashFade 2.4s ease forwards;pointer-events:none}.opero-splash[hidden]{display:none}.splash-shell{display:flex;flex-direction:column;align-items:center;gap:18px}.splash-product{font-size:28px;font-weight:800;letter-spacing:.22em}.splash-loading{font-size:15px;color:rgba(236,242,255,.9)}@keyframes splashFade{0%,70%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}.top,.subtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{display:flex;gap:11px;align-items:center;min-width:0}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#00c8ff,#0a84ff,#0046c8);display:grid;place-items:center;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:800}.title{font-size:22px;font-weight:900;letter-spacing:-.045em}.icon-btn,.back-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--blueSoft);color:var(--text);font:inherit;font-weight:900;display:grid;place-items:center;cursor:pointer}.section-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:900;margin:16px 2px 9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:116px;border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--text);font:inherit;font-weight:800;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));cursor:pointer}.tile.blue{background:linear-gradient(160deg,rgba(78,158,255,.30),rgba(78,158,255,.09))}.tile.purple{background:linear-gradient(160deg,rgba(159,107,255,.30),rgba(159,107,255,.09))}.tile.green{background:linear-gradient(160deg,rgba(53,212,141,.26),rgba(53,212,141,.08))}.tile.amber{background:linear-gradient(160deg,rgba(245,185,66,.26),rgba(245,185,66,.08))}.tile.red{background:linear-gradient(160deg,rgba(255,95,122,.26),rgba(255,95,122,.08))}.tile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.tile-icon{width:38px;height:38px;border-radius:13px;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.07)}.pill{font-size:11px;line-height:1;border:1px solid var(--line);border-radius:999px;padding:6px 8px;color:var(--muted);background:rgba(255,255,255,.04);white-space:nowrap}.tile-number{font-size:34px;font-weight:900;letter-spacing:-.06em}.card{border:1px solid var(--line);background:rgba(13,27,47,.92);border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 10px 26px rgba(0,0,0,.16)}.card-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.card-title{font-size:15px;font-weight:900}.muted,.small{font-size:12px;color:var(--muted);line-height:1.35}.list{display:grid;gap:9px}.customer-card{border:1px solid var(--line);border-radius:18px;padding:13px;background:rgba(255,255,255,.035)}.customer-card.priority{border-color:rgba(159,107,255,.35)}.customer-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.customer-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}.badge{font-size:10px;font-weight:900;border-radius:999px;padding:5px 7px;border:1px solid transparent;white-space:nowrap}.b-blue{background:var(--blueSoft);color:#afd5ff}.b-purple{background:var(--purpleSoft);color:#ddcaff}.b-red{background:var(--redSoft);color:#ffb5c0}.b-green{background:var(--greenSoft);color:#b8f5d5}.b-amber{background:var(--amberSoft);color:#ffe1a0}.note{font-size:12px;color:#cbd8ef;line-height:1.4;margin-top:8px;white-space:pre-wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;padding:9px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:var(--blueSoft);border-color:rgba(78,158,255,.28)}.btn.danger,.danger{background:var(--redSoft);border-color:rgba(255,95,122,.28)}.btn.full{width:100%;justify-content:center;display:flex}.search{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:10px 12px;margin-bottom:10px}.search input,input,textarea,select{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit}.form{display:grid;gap:10px}.field{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:10px 12px}.field label{display:block;font-size:10px;color:var(--dim);font-weight:900;text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}textarea{resize:vertical;min-height:90px}.hero{border:1px solid var(--line2);background:linear-gradient(160deg,rgba(78,158,255,.18),rgba(255,255,255,.04));border-radius:24px;padding:16px;margin-bottom:12px}.hero-name{font-size:24px;font-weight:950;letter-spacing:-.05em}.info-row{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}.info-row:last-child{border-bottom:0}.info-key{font-size:11px;color:var(--dim);font-weight:900}.info-val{font-size:13px}.info-val a{color:#b9dcff}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#122742;border:1px solid var(--line2);color:var(--text);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:300}.toast.show{opacity:1}.empty{border:1px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-size:13px}
</style></head><body><div class="opero-splash" id="operoSplash"><div class="splash-shell"><div class="splash-product">OPERO</div><div class="splash-product">KONTAKTI</div><div class="splash-loading">Ladataan...</div></div></div><main class="phone">
<section id="home" class="screen on"><header class="top"><div class="brand"><div class="logo">O</div><div><div class="eyebrow">Opero · Kontakti</div><div class="title">Mobiili</div></div></div><button class="icon-btn" onclick="openScreen('settings')">⚙️</button></header><div class="section-label">Päätoiminnot</div><div class="grid2"><button class="tile blue" onclick="openScreen('calls')"><div class="tile-head"><div class="tile-icon">📞</div><div class="pill">Tänään</div></div><div><div>Soitot tänään</div><div class="tile-number" id="statCalls">0</div></div></button><button class="tile" onclick="openScreen('customers')"><div class="tile-head"><div class="tile-icon">👥</div><div class="pill">Yhteensä</div></div><div><div>Asiakkaat</div><div class="tile-number" id="statCustomers">0</div></div></button><button class="tile purple" onclick="openScreen('priority')"><div class="tile-head"><div class="tile-icon">🟣</div><div class="pill">Tärkeät</div></div><div><div>Priority</div><div class="tile-number" id="statPriority">0</div></div></button><button class="tile green" onclick="openScreen('add')"><div class="tile-head"><div class="tile-icon">＋</div><div class="pill">Kentällä</div></div><div><div>Uusi asiakas</div><div class="tile-number">+</div></div></button></div><div class="section-label">Päivän koonti</div><div class="grid2"><button class="tile green" onclick="openSummary('meetings')"><div class="tile-head"><div class="tile-icon">🤝</div><div class="pill">Tänään</div></div><div><div>Tapaamiset</div><div class="tile-number" id="statMeetings">0</div></div></button><button class="tile red" onclick="openSummary('overdue')"><div class="tile-head"><div class="tile-icon">⏰</div><div class="pill">Myöhässä</div></div><div><div>Erääntyneet</div><div class="tile-number" id="statOverdue">0</div></div></button><button class="tile amber" onclick="openMaps()"><div class="tile-head"><div class="tile-icon">🗺️</div><div class="pill">Google</div></div><div><div>Maps</div><div class="tile-number">›</div></div></button><button class="tile" onclick="openSummary('done')"><div class="tile-head"><div class="tile-icon">✅</div><div class="pill">Valmiit</div></div><div><div>Hoidettu</div><div class="tile-number" id="statDone">0</div></div></button></div></section>
<section id="calls" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('home')">←</button><h2>Soitot tänään</h2><div class="pill" id="callsCount">0</div></div><div class="list" id="callsList"></div></section>
<section id="customers" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('home')">←</button><h2>Asiakkaat</h2><button class="icon-btn" onclick="openScreen('add')">＋</button></div><div class="search">🔎<input id="searchInput" placeholder="Hae nimellä, kaupungilla tai Y-tunnuksella" oninput="renderCustomers()"></div><div class="list" id="customersList"></div></section>
<section id="priority" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('home')">←</button><h2>Priority</h2><div class="pill" id="priorityCount">0</div></div><div class="list" id="priorityList"></div></section>
<section id="summary" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('home')">←</button><h2><span id="summaryIcon"></span> <span id="summaryTitle"></span></h2><div class="pill" id="summaryCount">0</div></div><div class="card"><div class="card-title" id="summaryListTitle"></div><div class="list" id="summaryList" style="margin-top:10px"></div></div></section>
<section id="detail" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('customers')">←</button><h2>Asiakaskortti</h2><button class="icon-btn" onclick="deleteCurrent()">🗑️</button></div><div id="detailContent"></div></section>
<section id="entry" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('detail')">←</button><h2>Merkintä</h2></div><div class="card"><div class="card-title" id="entryName"></div><div class="form" style="margin-top:12px"><div class="field"><label>Toimenpide</label><select id="entryType"><option>Soitto</option><option>Tapaaminen</option><option>Sähköposti</option><option>Seuranta</option></select></div><div class="field"><label>Muistiinpano</label><textarea id="entryNote"></textarea></div><div class="field"><label>Seuraava päivä</label><input id="entryNext" type="date"></div><div class="field"><label>Priority</label><select id="entryPrio"><option value="0">Ei</option><option value="1">Kyllä</option></select></div><button class="btn primary full" onclick="saveEntry()">Tallenna</button></div></div></section>
<section id="add" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('home')">←</button><h2>Uusi asiakas</h2></div><div class="card"><div class="form"><div class="field"><label>Nimi</label><input id="newName"></div><div class="field"><label>Kaupunki</label><input id="newCity"></div><div class="field"><label>Y-tunnus</label><input id="newBid"></div><div class="field"><label>Puhelin</label><input id="newPhone"></div><div class="field"><label>Osoite</label><input id="newAddress"></div><div class="field"><label>Muistiinpano</label><textarea id="newNote"></textarea></div><div class="field"><label>Priority</label><select id="newPrio"><option value="0">Ei</option><option value="1">Kyllä</option></select></div><button class="btn primary full" onclick="addCustomer()">Tallenna uusi asiakas</button></div></div></section>
<section id="archive" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('settings')">←</button><h2>Arkisto</h2></div><div class="card"><div class="card-head"><div><div class="card-title">Poistetut asiakkaat</div><div class="muted">Soft delete: palautus onnistuu</div></div><div class="pill" id="archiveCount">0</div></div><div class="list" id="archiveList"></div></div></section>
<section id="settings" class="screen"><div class="subtop"><button class="back-btn" onclick="openScreen('home')">←</button><h2>Asetukset</h2></div><div class="card"><div class="card-head"><div><div class="card-title">Testiversio</div><div class="muted">Data tallentuu selaimen muistiin</div></div></div><div class="list"><button class="btn full" onclick="openScreen('archive')">Arkisto / palautus</button><button class="btn full" onclick="document.getElementById('desktopImportFile').click()">Tuo desktopista</button><input id="desktopImportFile" type="file" accept=".json,application/json,text/plain" style="display:none" onchange="importDesktopJson(event)"><button class="btn full" onclick="copyJson()">Kopioi JSON</button><button class="btn danger full" onclick="resetData()">Palauta testidata</button></div></div></section><div class="toast" id="toast"></div></main>
<script>
const STORAGE_KEY="kontakti_mobile_2x2_maps_logo_v4_20260614";const TODAY=new Date().toISOString().slice(0,10);const SEED_CUSTOMERS=[{id:"c1",customer_id:"KON-0001",name:"Ravintola Ottopoika",city:"Kuopio",business_id:"",address:"Kauppakatu 40-42, Kuopio",phone:"",next_date:"2026-04-20",next_action:"Tapaaminen",priority:false,meeting:true,done:false,incomplete:false,deleted_at:null,notes:[{date:"2026-04-17",type:"Tapaaminen",text:"Testiasiakas mobiiliviikon kokeiluun."}]},{id:"c2",customer_id:"KON-0002",name:"Bar Pörrin Pesä",city:"Kuopio",business_id:"2836710-3",address:"Kalevalankatu 29, Kuopio",phone:"",next_date:"2026-04-21",next_action:"Soitto",priority:false,meeting:false,done:false,incomplete:false,deleted_at:null,notes:[{date:"2026-04-17",type:"Soitto",text:"Testiasiakas mobiiliviikon kokeiluun."}]}];let customers=loadCustomers();let currentId=customers[0]?.id||null;function loadCustomers(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return JSON.parse(raw)}catch(e){}return SEED_CUSTOMERS.map(c=>({...c,email:"",created_source:"seed"}))}function saveCustomers(){localStorage.setItem(STORAGE_KEY,JSON.stringify(customers))}function activeCustomers(){return customers.filter(c=>!c.deleted_at)}function deletedCustomers(){return customers.filter(c=>c.deleted_at)}function byId(id){return customers.find(c=>c.id===id)}function isDue(c){return !c.done&&(c.priority||!!c.next_date&&c.next_date<=TODAY)}function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function sortSmart(arr){return [...arr].sort((a,b)=>(b.priority-a.priority)||String(a.next_date||"0000").localeCompare(String(b.next_date||"0000"))||a.name.localeCompare(b.name))}function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}function openScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));document.getElementById(id).classList.add("on");render();scrollTo(0,0)}function customerBadges(c){const arr=[];if(c.priority)arr.push('<span class="badge b-purple">Priority</span>');if(c.incomplete)arr.push('<span class="badge b-amber">Täydennä</span>');if(c.next_date&&c.next_date<TODAY)arr.push('<span class="badge b-red">Erääntynyt</span>');else if(c.next_date===TODAY)arr.push('<span class="badge b-blue">Tänään</span>');if(c.done)arr.push('<span class="badge b-green">Soitettu</span>');return arr.join("")}function customerCard(c){const phone=String(c.phone||"").replace(/[^0-9+]/g,"");const latest=c.notes?.[0]?.text||"Ei merkintöjä.";return`<article class="customer-card ${c.priority?"priority":""}"><div class="customer-row"><div style="min-width:0"><div class="customer-name">${escapeHtml(c.name)}</div><div class="small">${escapeHtml(c.city||"")}${c.business_id?" · "+escapeHtml(c.business_id):""}</div></div><div class="badges">${customerBadges(c)}</div></div><div class="small">Seuraava: <b>${escapeHtml(c.next_date||"ei päivää")}</b> · ${escapeHtml(c.next_action||"Soitto")}</div><div class="note">${escapeHtml(latest)}</div><div class="actions">${phone?`<a class="btn primary" href="tel:${phone}">📞</a>`:'<button class="btn" disabled>📞</button>'}<button class="btn" onclick="openDetail('${c.id}')">Avaa</button><button class="btn" onclick="openEntry('${c.id}')">Merkintä</button>${c.done?`<button class="btn" onclick="unmarkDone('${c.id}')">Palauta</button>`:`<button class="btn primary" onclick="markDone('${c.id}')">Hoidettu</button>`}</div></article>`}function doneCustomerCard(c){const phone=String(c.phone||"").replace(/[^0-9+]/g,"");const latest=c.notes?.[0]?.text||"Merkitty hoidetuksi.";return`<article class="customer-card"><div class="customer-row"><div style="min-width:0"><div class="customer-name">${escapeHtml(c.name)}</div><div class="small">${escapeHtml(c.city||"")}${c.business_id?" · "+escapeHtml(c.business_id):""}</div></div><div class="badges"><span class="badge b-green">Hoidettu</span></div></div><div class="note">${escapeHtml(latest)}</div><div class="actions">${phone?`<a class="btn primary" href="tel:${phone}">📞</a>`:'<button class="btn" disabled>📞</button>'}<button class="btn" onclick="openDetail('${c.id}')">Avaa</button><button class="btn" onclick="openEntry('${c.id}')">Merkintä</button><button class="btn" onclick="unmarkDone('${c.id}')">Palauta</button></div></article>`}function render(){const active=activeCustomers();const calls=sortSmart(active.filter(isDue));const meetings=active.filter(c=>c.meeting&&!c.done);const overdue=active.filter(c=>c.next_date&&c.next_date<TODAY&&!c.done);const done=active.filter(c=>c.done);statCalls.textContent=calls.length;statCustomers.textContent=active.length;statPriority.textContent=active.filter(c=>c.priority).length;statMeetings.textContent=meetings.length;statOverdue.textContent=overdue.length;statDone.textContent=done.length;callsCount.textContent=calls.length+" kpl";callsList.innerHTML=calls.map(customerCard).join("")||'<div class="empty">Ei soitettavia.</div>';renderCustomers();const prios=sortSmart(active.filter(c=>c.priority));priorityCount.textContent=prios.length+" kpl";priorityList.innerHTML=prios.map(customerCard).join("")||'<div class="empty">Ei priority-asiakkaita.</div>';const deleted=deletedCustomers();archiveCount.textContent=deleted.length+" kpl";archiveList.innerHTML=deleted.map(c=>`<article class="customer-card"><div class="customer-name">${escapeHtml(c.name)}</div><div class="small">Arkistoitu ${escapeHtml(c.deleted_at||"")}</div><button class="btn primary full" onclick="restoreCustomer('${c.id}')">Palauta</button></article>`).join("")||'<div class="empty">Arkisto on tyhjä.</div>';if(document.getElementById("detail").classList.contains("on"))renderDetail()}function renderCustomers(){const q=(searchInput?.value||"").toLowerCase();const list=sortSmart(activeCustomers().filter(c=>[c.name,c.city,c.business_id,c.address].join(" ").toLowerCase().includes(q)));customersList.innerHTML=list.map(customerCard).join("")||'<div class="empty">Ei osumia.</div>'}const summaryConfigs={meetings:{title:"Tapaamiset",icon:"🤝",listTitle:"Tapaamiset",filter:c=>c.meeting&&!c.done},overdue:{title:"Erääntyneet",icon:"⏰",listTitle:"Erääntyneet asiakkaat",filter:c=>c.next_date&&c.next_date<TODAY&&!c.done},done:{title:"Hoidettu",icon:"✅",listTitle:"Hoidetut asiakkaat",filter:c=>c.done}};function openSummary(key){const config=summaryConfigs[key];if(!config)return;summaryTitle.textContent=config.title;summaryIcon.textContent=config.icon;summaryListTitle.textContent=config.listTitle;const items=sortSmart(activeCustomers().filter(config.filter));summaryCount.textContent=items.length+" kpl";summaryList.innerHTML=(key==="done"?items.map(c=>doneCustomerCard(c)):items.map(customerCard)).join("")||'<div class="empty">Ei asiakkaita tässä ryhmässä.</div>';openScreen("summary")}function openMaps(){window.open("https://www.google.com/maps/dir/","_blank","noopener")}function openDetail(id){currentId=id;openScreen("detail")}function renderDetail(){const c=byId(currentId);if(!c)return;const phone=String(c.phone||"").replace(/[^0-9+]/g,"");const mapsUrl=c.address?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c.address):"#";detailContent.innerHTML=`<div class="hero"><div class="hero-name">${escapeHtml(c.name)}</div><div class="small">${escapeHtml(c.city||"")} · ${escapeHtml(c.customer_id||"")}</div><div class="badges" style="justify-content:flex-start;max-width:none;margin-top:8px">${customerBadges(c)}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Perustiedot</div><div class="muted">${c.incomplete?"Mobiilista lisätty — täydennä desktopissa":"Hiljainen tieto ennen soittoa"}</div></div></div><div class="info-row"><div class="info-key">Y-tunnus</div><div class="info-val">${escapeHtml(c.business_id||"—")}</div></div><div class="info-row"><div class="info-key">Puhelin</div><div class="info-val">${phone?`<a href="tel:${phone}">${escapeHtml(c.phone)}</a>`:"—"}</div></div><div class="info-row"><div class="info-key">Osoite</div><div class="info-val">${c.address?`<a href="${mapsUrl}" target="_blank" rel="noopener">${escapeHtml(c.address)}</a>`:"—"}</div></div><div class="info-row"><div class="info-key">Seuraava</div><div class="info-val">${escapeHtml(c.next_date||"ei päivää")}<br>${escapeHtml(c.next_action||"")}</div></div><div class="actions"><button class="btn primary" onclick="openEntry('${c.id}')">Merkintä</button><button class="btn" onclick="window.open('${mapsUrl}','_blank','noopener')">Kartta</button><button class="btn" onclick="togglePriority('${c.id}')">Priority</button><button class="btn danger" onclick="softDelete('${c.id}')">Poista</button></div></div><div class="card"><div class="card-title">Merkinnät</div><div class="list" style="margin-top:10px">${(c.notes||[]).map(n=>`<div class="customer-card"><div class="small">${escapeHtml(n.date)} · ${escapeHtml(n.type)}</div><div class="note">${escapeHtml(n.text)}</div></div>`).join("")||'<div class="empty">Ei merkintöjä.</div>'}</div></div>`}function openEntry(id){currentId=id;const c=byId(id);entryName.textContent=c?.name||"Asiakas";entryNote.value="";entryNext.value="";entryPrio.value=c?.priority?"1":"0";openScreen("entry")}function saveEntry(){const c=byId(currentId);if(!c)return;const type=entryType.value;c.notes=[{date:TODAY,type:type,text:entryNote.value||type},...(c.notes||[])];c.next_action=type;if(entryNext.value)c.next_date=entryNext.value;c.priority=entryPrio.value==="1";if(type==="Soitto"||type==="Tapaaminen")c.done=true;if(type==="Tapaaminen")c.meeting=true;saveCustomers();toast("Merkintä tallennettu");openScreen("detail")}function addCustomer(){if(!newName.value.trim()){toast("Nimi puuttuu");return}const now=Date.now();const c={id:"mob_"+now,customer_id:"MOB-"+now,name:newName.value.trim(),business_id:newBid.value.trim(),phone:newPhone.value.trim(),address:newAddress.value.trim(),city:newCity.value.trim(),next_date:"",next_action:"Uusi asiakas",priority:newPrio.value==="1",meeting:false,done:false,incomplete:true,created_source:"mobile",deleted_at:null,notes:[{date:TODAY,type:"Uusi asiakas",text:newNote.value||"Lisätty mobiilissa. Täydennä tiedot desktopissa."}]};customers.unshift(c);saveCustomers();currentId=c.id;["newName","newBid","newPhone","newAddress","newCity","newNote"].forEach(id=>{document.getElementById(id).value=""});newPrio.value="0";toast("Uusi asiakas tallennettu");openScreen("detail")}function markDone(id){const c=byId(id);if(!c)return;c.done=true;c.notes=[{date:TODAY,type:"Hoidettu",text:"Merkitty hoidetuksi mobiilissa."},...(c.notes||[])];saveCustomers();toast("Merkitty hoidetuksi");render()}function unmarkDone(id){const c=byId(id);if(!c)return;c.done=false;saveCustomers();toast("Palautettu päivän listalle");render()}function softDelete(id){const c=byId(id);if(!c)return;if(!confirm("Arkistoidaanko asiakas?"))return;c.deleted_at=new Date().toISOString();saveCustomers();toast("Asiakas arkistoitu");openScreen("home")}function deleteCurrent(){softDelete(currentId)}function restoreCustomer(id){const c=byId(id);if(!c)return;c.deleted_at=null;saveCustomers();toast("Asiakas palautettu");render()}function togglePriority(id){const c=byId(id);if(!c)return;c.priority=!c.priority;saveCustomers();renderDetail();render();toast(c.priority?"Priority päällä":"Priority pois")}function normalizeImportedCustomer(c,i){const id=String(c.id||c.customer_id||c.customerId||("desk_"+Date.now()+"_"+i));return{...c,id:id,customer_id:String(c.customer_id||c.customerId||id),name:c.name||"Nimetön asiakas",city:c.city||"",business_id:c.business_id||c.businessId||"",address:c.address||"",phone:c.phone||"",email:c.email||"",next_date:c.next_date||c.nextDate||"",next_action:c.next_action||c.nextAction||"Soitto",priority:!!c.priority,meeting:!!c.meeting||String(c.next_action||c.nextAction||"").toLowerCase().includes("tapa"),done:!!c.done,incomplete:!!c.incomplete,created_source:c.created_source||"desktop_import",deleted_at:c.deleted_at||null,notes:Array.isArray(c.notes)?c.notes:[]}}function mergeNotes(oldNotes,newNotes){const seen=new Set();const out=[];for(const n of [...(newNotes||[]),...(oldNotes||[])]){const key=[n.date||"",n.type||"",n.text||""].join("|");if(seen.has(key))continue;seen.add(key);out.push(n)}return out}async function importDesktopJson(ev){const file=ev.target.files&&ev.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());const arr=obj.customers||obj.data?.customers||obj;if(!Array.isArray(arr))throw new Error("JSONissa ei ole customers-listaa");let added=0,updated=0;for(let i=0;i<arr.length;i++){const inc=normalizeImportedCustomer(arr[i],i);const idx=customers.findIndex(c=>c.id===inc.id||c.customer_id===inc.customer_id);if(idx>=0){customers[idx]={...customers[idx],...inc,notes:mergeNotes(customers[idx].notes,inc.notes)};updated++}else{customers.push(inc);added++}}saveCustomers();toast(`Tuotu ${added} uutta, päivitetty ${updated}`);render();openScreen("home")}catch(e){toast("Tuonti epäonnistui: "+e.message)}finally{ev.target.value=""}}function resetData(){if(confirm("Palautetaanko testidata?")){localStorage.removeItem(STORAGE_KEY);customers=loadCustomers();toast("Testidata palautettu");openScreen("home")}}async function copyJson(){try{await navigator.clipboard.writeText(JSON.stringify(customers,null,2));toast("JSON kopioitu")}catch(e){toast("Kopiointi ei onnistunut")}}function hideSplash(){const splash=document.getElementById("operoSplash");if(splash)setTimeout(()=>splash.setAttribute("hidden",""),2600)}hideSplash();render();
</script></body></html>
