<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Kontakti Mobiili · Opero</title>
<style>
html,body{min-height:100%;margin:0;background:#071226;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center}.box{max-width:360px;padding:22px;text-align:center}.spin{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:#4e9eff;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#ffb5c0;white-space:pre-wrap;text-align:left;background:rgba(255,95,122,.12);border:1px solid rgba(255,95,122,.25);border-radius:16px;padding:12px;margin-top:12px}
</style>
</head>
<body><div class="box"><div class="spin"></div><h2>Ladataan Kontakti Mobiilia…</h2><p>Hetki.</p><div id="err" class="err" style="display:none"></div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/Hekse/kontakti-mobile/2d30785a5cdff1ff49dd165142a6aad280932abe/index.html?cb='+Date.now();
  const css=`\n/* Selkeä lomakenäkymä mobiilissa */\n.field{background:#10233d!important;border:1px solid rgba(190,215,255,.46)!important;border-radius:18px!important;padding:12px 13px!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)!important}\n.field label{color:#dbe8ff!important;font-size:11px!important;margin-bottom:8px!important;display:block!important}\n.field input,.field textarea,.field select{display:block!important;width:100%!important;min-height:46px!important;background:#071226!important;color:#ffffff!important;-webkit-text-fill-color:#ffffff!important;border:1px solid rgba(190,215,255,.32)!important;border-radius:13px!important;padding:10px 12px!important;font-size:16px!important;font-weight:800!important;line-height:1.25!important;box-shadow:0 0 0 1px rgba(78,158,255,.10)!important;opacity:1!important}\n.field textarea{min-height:94px!important;font-weight:700!important}\n.field select{appearance:none!important;-webkit-appearance:none!important;background-image:linear-gradient(45deg,transparent 50%,#eef4ff 50%),linear-gradient(135deg,#eef4ff 50%,transparent 50%)!important;background-position:calc(100% - 18px) 19px,calc(100% - 12px) 19px!important;background-size:6px 6px,6px 6px!important;background-repeat:no-repeat!important;padding-right:36px!important}\n.field select option,select option{background:#071226!important;color:#ffffff!important;-webkit-text-fill-color:#ffffff!important;font-size:16px!important}\n.field input::placeholder,.field textarea::placeholder{color:#b9c9e8!important;opacity:1!important}\n.field input:focus,.field textarea:focus,.field select:focus{outline:none!important;border-color:#4e9eff!important;box-shadow:0 0 0 3px rgba(78,158,255,.22)!important;background:#0d1b2f!important}\ninput[type=date]{color-scheme:dark!important;position:relative!important}\ninput[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)!important;opacity:1!important;background-color:rgba(78,158,255,.28)!important;border-radius:8px!important;padding:5px!important;margin-left:8px!important;cursor:pointer!important}\n`;
  const js=`\n<script>\n(function(){\n  function forceFields(){\n    document.querySelectorAll('.field input,.field textarea,.field select').forEach(el=>{\n      el.style.backgroundColor='#071226';\n      el.style.color='#ffffff';\n      el.style.webkitTextFillColor='#ffffff';\n      el.style.border='1px solid rgba(190,215,255,.34)';\n      el.style.borderRadius='13px';\n      el.style.minHeight=el.tagName==='TEXTAREA'?'94px':'46px';\n      el.style.padding='10px 12px';\n      el.style.fontSize='16px';\n      el.style.fontWeight='800';\n    });\n  }\n  forceFields();\n  setInterval(forceFields,800);\n})();\n<\/script>`;
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
    html=html.replace('</style>',css+'</style>').replace('</body>',js+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Lataus epäonnistui: '+e.message+'\nPäivitä sivu tai avaa hetken päästä uudelleen.'}
})();
</script></body></html>
