<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Kontakti Mobiili · Opero</title>
<style>
html,body{min-height:100%;margin:0;background:#071226;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center}.box{max-width:360px;padding:22px;text-align:center}.spin{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:#4e9eff;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#ffb5c0;white-space:pre-wrap;text-align:left;background:rgba(255,95,122,.12);border:1px solid rgba(255,95,122,.25);border-radius:16px;padding:12px;margin-top:12px}
</style>
</head>
<body><div class="box"><div class="spin"></div><h2>Ladataan Kontakti Mobiilia…</h2><p>Hetki.</p><div id="err" class="err" style="display:none"></div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/Hekse/kontakti-mobile/2d30785a5cdff1ff49dd165142a6aad280932abe/index.html?cb='+Date.now();
  const css=`\n/* Korjaus lomakekenttien kontrastiin */\nselect,input[type=date],input,textarea{color-scheme:dark}\n.field{background:rgba(13,27,47,.96)!important;border-color:rgba(190,215,255,.34)!important}\n.field input,.field textarea,.field select{background:#0d1b2f!important;color:#eef4ff!important;border-radius:12px!important;padding:2px 0!important}\n.field select option,select option{background:#0d1b2f!important;color:#eef4ff!important}\n.field select:focus,.field input:focus,.field textarea:focus{background:#10233d!important;color:#fff!important}\ninput[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.95;background-color:rgba(78,158,255,.16);border-radius:8px;padding:4px;cursor:pointer}\n.field label{color:#b9c9e8!important}\n`;
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
    html=html.replace('</style>',css+'</style>');
    document.open();document.write(html);document.close();
  }catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Lataus epäonnistui: '+e.message+'\nPäivitä sivu tai avaa hetken päästä uudelleen.'}
})();
</script></body></html>
