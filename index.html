<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Kontakti Mobiili · Opero</title>
<style>
html,body{min-height:100%;margin:0;background:#071226;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center}.box{max-width:360px;padding:22px;text-align:center}.spin{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:#4e9eff;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#ffb5c0;white-space:pre-wrap;text-align:left;background:rgba(255,95,122,.12);border:1px solid rgba(255,95,122,.25);border-radius:16px;padding:12px;margin-top:12px}
</style>
</head>
<body><div class="box"><div class="spin"></div><h2>Ladataan Kontakti Mobiilia…</h2><p>Hetki.</p><div id="err" class="err" style="display:none"></div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/Hekse/kontakti-mobile/2d30785a5cdff1ff49dd165142a6aad280932abe/index.html?cb='+Date.now();
  const css=`\n.field{background:#10233d!important;border:1px solid rgba(190,215,255,.46)!important;border-radius:18px!important;padding:12px 13px!important}\n.field label{color:#dbe8ff!important;font-size:11px!important;margin-bottom:8px!important;display:block!important}\n.field input,.field textarea,.field select{display:block!important;width:100%!important;min-height:46px!important;background:#071226!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border:1px solid rgba(190,215,255,.32)!important;border-radius:13px!important;padding:10px 12px!important;font-size:16px!important;font-weight:800!important;opacity:1!important}\n.field textarea{min-height:94px!important;font-weight:700!important}\n.field select{appearance:none!important;-webkit-appearance:none!important;background-image:linear-gradient(45deg,transparent 50%,#eef4ff 50%),linear-gradient(135deg,#eef4ff 50%,transparent 50%)!important;background-position:calc(100% - 18px) 19px,calc(100% - 12px) 19px!important;background-size:6px 6px,6px 6px!important;background-repeat:no-repeat!important;padding-right:36px!important}\n.field select option,select option{background:#071226!important;color:#fff!important}\ninput[type=date]{color-scheme:dark!important}\ninput[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)!important;opacity:1!important;background-color:rgba(78,158,255,.28)!important;border-radius:8px!important;padding:5px!important}\n.sync-box{border:1px solid rgba(190,215,255,.24);background:rgba(78,158,255,.08);border-radius:18px;padding:12px;margin:10px 0}\n`;
  const js=`\n<script>\n(function(){\n  const META='kontakti_mobile_sync_meta_v1';\n  function meta(){try{return JSON.parse(localStorage.getItem(META)||'{"pending":0,"changed":[]}')}catch(e){return {pending:0,changed:[]}}}\n  function setMeta(m){localStorage.setItem(META,JSON.stringify(m));updateSyncUi()}\n  function flag(id){const m=meta();if(id&&!m.changed.includes(id))m.changed.push(id);m.pending=m.changed.length;m.updated_at=new Date().toISOString();setMeta(m)}\n  function updateSyncUi(){const m=meta();const el=document.getElementById('syncPendingText');if(el)el.textContent=m.pending+' muutosta odottaa vientiä';}\n  function forceFields(){document.querySelectorAll('.field input,.field textarea,.field select').forEach(el=>{el.style.backgroundColor='#071226';el.style.color='#fff';el.style.webkitTextFillColor='#fff';el.style.border='1px solid rgba(190,215,255,.34)';el.style.borderRadius='13px';el.style.minHeight=el.tagName==='TEXTAREA'?'94px':'46px';el.style.padding='10px 12px';el.style.fontSize='16px';el.style.fontWeight='800';});}\n  window.renderCustomers=function(){const input=document.getElementById('searchInput');const target=document.getElementById('customersList');if(!target)return;const q=(input&&input.value?input.value:'').trim().toLowerCase();const all=sortSmart(activeCustomers());const list=(q?all.filter(c=>[c.name,c.city,c.business_id,c.address,c.phone].join(' ').toLowerCase().includes(q)).slice(0,25):all.slice(0,5));const help=q?'Hakutuloksia näytetään enintään 25.':'Näytetään 5 asiakasta. Hae loput nimellä, kaupungilla tai Y-tunnuksella.';target.innerHTML='<div class="small" style="margin:0 2px 10px">'+help+'</div>'+(list.map(customerCard).join('')||'<div class="empty">Ei osumia.</div>');};\n  const oldSaveEntry=window.saveEntry;window.saveEntry=function(){const id=currentId;oldSaveEntry();flag(id)};\n  const oldAdd=window.addCustomer;window.addCustomer=function(){oldAdd();flag(currentId)};\n  const oldDone=window.markDone;window.markDone=function(id){oldDone(id);flag(id)};\n  const oldUndone=window.unmarkDone;window.unmarkDone=function(id){oldUndone(id);flag(id)};\n  const oldPrio=window.togglePriority;window.togglePriority=function(id){oldPrio(id);flag(id)};\n  window.exportMobileChanges=function(){const m=meta();const ids=m.changed||[];const data=customers.filter(c=>ids.includes(c.id)||ids.includes(c.customer_id));const out={schema:'kontakti-mobile-changes-v1',source:'kontakti-mobile',exported_at:new Date().toISOString(),changes:data};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kontakti_mobiilimuutokset_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Mobiilimuutokset viety');};\n  window.clearMobileChanges=function(){if(confirm('Merkitäänkö mobiilimuutokset viedyiksi?'))setMeta({pending:0,changed:[],updated_at:new Date().toISOString()})};\n  function addSyncUi(){const s=document.getElementById('settings');if(!s||document.getElementById('syncPendingText'))return;const card=s.querySelector('.card .list');if(!card)return;card.insertAdjacentHTML('afterbegin','<div class="sync-box"><div class="card-title">Mobiilimuutokset</div><div class="muted" id="syncPendingText">0 muutosta odottaa vientiä</div></div><button class="btn primary full" onclick="exportMobileChanges()">Vie mobiilimuutokset</button><button class="btn full" onclick="clearMobileChanges()">Merkitse viedyiksi</button>');updateSyncUi()}\n  forceFields();addSyncUi();render();\n})();\n<\/script>`;
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
    html=html.replace('</style>',css+'</style>').replace('</body>',js+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){const el=document.getElementById('err');el.style.display='block';el.textContent='Lataus epäonnistui: '+e.message+'\nPäivitä sivu tai avaa hetken päästä uudelleen.'}
})();
</script></body></html>
