<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontakti – Ajo ja kulut, paikallinen esikatselu</title><link rel="stylesheet" href="../ajo-kulut.css"><style>:root{--solid:#101f32;--stroke:#2d435f;--bg0:#081626;--text:#edf4ff;--muted:#a4b8d2;--brand-rgb:56,130,246;--danger-rgb:255,110,110}body{margin:0;background:#071226;color:var(--text);font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}h1{letter-spacing:2px}button{cursor:pointer}.test-tools{padding:12px;background:#20334b;border-radius:12px;font-size:13px}</style><main><h1>OPERO KONTAKTI</h1><div class="test-tools" hidden><button id="fail">Testaa yhteyskatko seuraavan kulun jälkeen</button><p id="proof">Tallennettuja ajoja 0, kuluja 0</p></div><div class="ajo-app" id="app"></div></main><script type="module">
import{createAjoKulut}from'../ajo-kulut.js';
window.print=()=>{document.querySelector('#proof').textContent+=' · PDF-kuvat '+document.querySelectorAll('#ajoPrint img').length};
const tables=JSON.parse(sessionStorage.getItem('preview-db')||'null')||{kontakti_trips:[],kontakti_trip_customers:[],kontakti_expenses:[],kontakti_expense_receipts:[]};let fail=false;
document.querySelector('#fail').onclick=()=>{fail=true;document.querySelector('#fail').textContent='Yhteyskatko aktivoitu'};
const proof=()=>document.querySelector('#proof').textContent=`Tallennettuja ajoja ${tables.kontakti_trips.length}, kuluja ${tables.kontakti_expenses.length}`;
const sb={from(table){let filters=[],start=0,end=499,single=false;const query={select(){return query},eq(k,v){filters.push(r=>r[k]===v);return query},is(k,v){filters.push(r=>(r[k]??null)===v);return query},order(){return query},range(a,b){start=a;end=b;return query},single(){single=true;return query},maybeSingle(){single=true;return query},then(resolve){const rows=tables[table].filter(r=>filters.every(f=>f(r))).slice(start,end+1);return Promise.resolve({data:single?(rows[0]||null):rows,error:null}).then(resolve)}};return query},async rpc(name,p){const isTrip=name==='kontakti_create_trip',table=isTrip?'kontakti_trips':'kontakti_expenses';if(!tables[table].some(r=>r.id===p.p_id)){tables[table].push(isTrip?{id:p.p_id,workspace_id:p.p_workspace,trip_date:p.p_date,route_text:p.p_route,kilometers:p.p_km,reimbursement:Math.round(p.p_km*p.p_rate*100)/100,notes:p.p_notes,created_at:new Date().toISOString()}:{id:p.p_id,workspace_id:p.p_workspace,expense_date:p.p_date,category:p.p_category,amount:p.p_amount,notes:p.p_notes,trip_id:p.p_trip,created_at:new Date().toISOString()});if(p.p_sha)tables.kontakti_expense_receipts.push({id:crypto.randomUUID(),expense_id:p.p_id,workspace_id:p.p_workspace,image_sha256:p.p_sha,storage_path:p.p_path});}sessionStorage.setItem('preview-db',JSON.stringify(tables));proof();if(!isTrip&&fail){fail=false;return {error:{message:'Testiyhteys katkesi tallennuksen jälkeen'}}}return {data:p.p_id,error:null}},storage:{from(){return {async upload(path,blob){sessionStorage.setItem('preview-receipt:'+path,await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob)}));return {data:{path},error:null}},async createSignedUrl(path){return {data:{signedUrl:sessionStorage.getItem('preview-receipt:'+path)},error:null}}}}}};
proof();createAjoKulut({sb,getWorkspace:async()=>({id:'preview-workspace'}),getUser:()=>({id:'preview-user'}),getCustomers:()=>[]}).open(document.querySelector('#app'));
</script></html>
