<!doctype html>
<html lang="fi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Kontakti Mobile</title>
<style>
:root{
  --bg0:#071226;--bg1:#091a35;--solid:#0a1731;--panel:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.13);
  --text:rgba(255,255,255,.95);--muted:rgba(255,255,255,.62);--tint:255,255,255;
  --ok-rgb:38,208,124;--danger-rgb:255,92,108;--warn-rgb:255,204,102;--amber-rgb:255,159,67;--brand-rgb:45,107,255;--prio-rgb:167,139,250;
  --call-bg:#178a51;--call-bg-active:#127543;
  --shadow:0 12px 32px rgba(0,0,0,.30);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg0:#eef2fa;--bg1:#e3eaf6;--solid:#e8eef8;--panel:rgba(24,46,90,.045);--stroke:rgba(24,46,90,.15);
  --text:rgba(16,26,46,.94);--muted:rgba(30,46,76,.62);--tint:24,46,90;
  --ok-rgb:18,150,88;--danger-rgb:210,50,70;--warn-rgb:176,112,20;--amber-rgb:196,110,20;--brand-rgb:37,99,235;--prio-rgb:124,58,237;
  --shadow:0 12px 32px rgba(30,50,90,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;font-family:var(--sans);color:var(--text);font-weight:400;
  background:radial-gradient(700px 480px at 20% 0%, rgba(var(--brand-rgb),.16), transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1));
  background-attachment:fixed;min-height:100dvh}
body.detail-open{overflow:hidden}
button{font-family:inherit}
.app{max-width:520px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:34px;height:34px;flex:0 0 34px;display:block}
.brand-name{font-size:19px;font-weight:620;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.hdr-actions{display:flex;align-items:center;gap:2px}
.lang{appearance:none;background:none;border:none;cursor:pointer;min-width:36px;min-height:44px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;opacity:.42;border-radius:10px;transition:opacity .15s ease}
.lang svg{width:22px;height:15px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(var(--tint),.18)}
.lang.active{opacity:1}
.lang:active{background:rgba(var(--tint),.06)}
.icon-btn{appearance:none;border:1px solid var(--stroke);background:rgba(var(--tint),.04);color:var(--text);border-radius:12px;width:44px;height:44px;flex:0 0 44px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;margin-left:4px}
.icon-btn:active{background:rgba(var(--tint),.09)}
.icon-btn.spin span{display:inline-block;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sticky controls */
.controls{position:sticky;top:0;z-index:10;margin:0 -12px;padding:6px 12px 8px;background:rgba(var(--tint),0);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.controls::before{content:"";position:absolute;inset:0;background:var(--bg0);opacity:.88;z-index:-1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{appearance:none;border:1px solid var(--stroke);background:rgba(var(--tint),.03);color:var(--muted);border-radius:13px;min-height:44px;padding:0 10px;font-size:14.5px;font-weight:540;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.tab.active{color:var(--text);background:rgba(var(--brand-rgb),.15);border-color:rgba(var(--brand-rgb),.45)}
.tab .count{font-size:11.5px;font-weight:550;min-width:22px;padding:1px 7px;border-radius:999px;background:rgba(var(--tint),.08);color:var(--text)}
.tab .count:empty{display:none}
.cust-controls{margin-top:8px}
.cust-controls[hidden]{display:none}
.search{position:relative}
.search input{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--stroke);background:rgba(var(--tint),.05);color:var(--text);padding:0 40px 0 16px;font-size:16px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:rgba(var(--brand-rgb),.6)}
.search input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:2px;top:0;width:44px;height:44px;border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.search-clear[hidden]{display:none}
.pills{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{appearance:none;flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--stroke);background:rgba(var(--tint),.03);color:var(--muted);font-size:13.5px;font-weight:520;cursor:pointer}
.pill.active{color:var(--text);background:rgba(var(--brand-rgb),.15);border-color:rgba(var(--brand-rgb),.45)}

/* List */
.list-meta{font-size:12px;color:var(--muted);margin:2px 2px 8px}
.list-meta:empty{display:none}
.list{margin-top:4px}
.status{font-size:12.5px;color:var(--muted);margin:4px 2px 8px}
.status:empty{display:none}
.status.err{color:rgb(var(--danger-rgb))}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}
.card{border:1px solid var(--stroke);background:var(--panel);border-radius:16px;padding:11px 12px;cursor:pointer;outline:none}
.card:active{background:rgba(var(--tint),.07)}
.card:focus-visible{border-color:rgba(var(--brand-rgb),.6)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.dot.green{background:rgb(var(--ok-rgb))}.dot.yellow{background:rgb(var(--warn-rgb))}.dot.orange{background:rgb(var(--amber-rgb))}.dot.red{background:rgb(var(--danger-rgb))}.dot.gray{background:rgba(var(--tint),.3)}
.card-name{flex:1;min-width:0;font-size:15px;font-weight:560;line-height:1.3;overflow-wrap:anywhere}
.chip-prio{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:550;line-height:1;padding:4px 8px;border-radius:999px;color:rgb(var(--prio-rgb));background:rgba(var(--prio-rgb),.12);border:1px solid rgba(var(--prio-rgb),.40)}
.chip-prio::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-prio[hidden]{display:none}
.card-line{margin:3px 0 0 17px;font-size:12.5px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.sep{opacity:.55;margin:0 2px}
.due-bad{color:rgb(var(--danger-rgb))}
.due-today{color:rgb(var(--ok-rgb))}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}
.qa button{appearance:none;min-height:44px;border-radius:11px;padding:0 4px;font-size:12.5px;font-weight:550;cursor:pointer;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa button:active{transform:scale(.97)}
.qa button:disabled{opacity:.5}
.qa .qa-ok{color:rgb(var(--ok-rgb));background:rgba(var(--ok-rgb),.07);border:1px solid rgba(var(--ok-rgb),.32)}
.qa .qa-miss{color:rgb(var(--danger-rgb));background:rgba(var(--danger-rgb),.07);border:1px solid rgba(var(--danger-rgb),.30)}
.qa .qa-snooze{color:rgb(var(--warn-rgb));background:rgba(var(--warn-rgb),.07);border:1px solid rgba(var(--warn-rgb),.30)}
.list-foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px}
.list-foot[hidden]{display:none}
.list-count{font-size:12.5px;color:var(--muted)}
.more-btn{appearance:none;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid rgba(var(--brand-rgb),.40);background:rgba(var(--brand-rgb),.08);color:var(--text);font-size:14px;font-weight:540;cursor:pointer}
.more-btn:active{background:rgba(var(--brand-rgb),.16)}
.more-btn[hidden]{display:none}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.foot[hidden]{display:none}
.linkbtn{appearance:none;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;min-height:44px;padding:0 6px}

/* Detail */
.detail{position:fixed;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:radial-gradient(700px 480px at 20% 0%, rgba(var(--brand-rgb),.12), transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1))}
.detail[hidden]{display:none}
.detail-inner{max-width:520px;margin:0 auto;padding:0 12px calc(120px + env(safe-area-inset-bottom))}
.detail-bar{position:sticky;top:0;z-index:5;display:flex;align-items:flex-start;gap:10px;margin:0 -12px;padding:8px 12px}
.detail-bar::before{content:"";position:absolute;inset:0;background:var(--bg0);opacity:.9;z-index:-1}
.detail-bar .icon-btn{margin-left:0}
.detail-title{flex:1;min-width:0;padding-top:3px}
.detail-title h1{margin:0;font-size:19px;font-weight:620;line-height:1.25;overflow-wrap:anywhere}
.detail-title .chip-prio{margin-top:5px}
.dstack{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{border:1px solid var(--stroke);background:var(--panel);border-radius:12px;padding:8px 9px;min-width:0}
.stat-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-size:14px;font-weight:560;margin-top:3px;display:flex;align-items:center;gap:5px;overflow-wrap:anywhere}
.stat-v .dot{margin-top:0;width:8px;height:8px;flex-basis:8px}
.stat-s{font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.prev{border:1px solid rgba(var(--brand-rgb),.32);background:rgba(var(--brand-rgb),.07);border-radius:14px;padding:10px 12px}
.prev-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prev-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500}
.prev-date{font-size:12.5px;color:var(--muted);white-space:nowrap}
.prev-body{margin-top:6px;font-size:14px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.prev-body.collapsed{max-height:8.7em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.prev-purch{margin-top:6px}
.prev-k{font-size:12px;color:var(--muted);font-weight:500}
.prev-none{margin-top:4px;font-size:13.5px;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tags:empty{display:none}
.tag{font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:999px;border:1px solid var(--stroke);background:rgba(var(--tint),.05);color:var(--text)}
.tag.ok{border-color:rgba(var(--ok-rgb),.35);background:rgba(var(--ok-rgb),.10)}
.more{appearance:none;background:none;border:none;color:rgb(var(--brand-rgb));font-size:13px;font-weight:550;padding:0;margin-top:0;min-height:44px;cursor:pointer}
.more[hidden]{display:none}
.call{display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px;border-radius:15px;background:var(--call-bg);color:#fff;text-decoration:none;padding:8px 14px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.call:active{background:var(--call-bg-active)}
.call svg{width:22px;height:22px;flex:0 0 22px}
.call-txt{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.call-txt b{font-size:17px;font-weight:620;line-height:1.15}
.call-txt small{font-size:12.5px;opacity:.88;overflow-wrap:anywhere}
.call.disabled{background:rgba(var(--tint),.06);color:var(--muted);box-shadow:none;pointer-events:none;border:1px solid var(--stroke)}
.sec2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--stroke);background:rgba(var(--tint),.04);color:var(--text);text-decoration:none;font-size:14px;font-weight:520;padding:0 8px;text-align:center}
.sec:active{background:rgba(var(--tint),.09)}
.sec.disabled{opacity:.4;pointer-events:none}
.box{border:1px solid var(--stroke);background:var(--panel);border-radius:14px;padding:12px}
.box-title{font-size:13.5px;font-weight:580;margin-bottom:10px}
.sub-label{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.box .qa{margin-top:0;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--stroke);background:rgba(var(--tint),.05);color:var(--text);padding:10px 12px;font-size:16px;font-family:inherit;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(var(--brand-rgb),.6)}
.field textarea{min-height:76px;resize:vertical;line-height:1.4}
.field select option{background:var(--solid);color:var(--text)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.grid2 .field{margin-bottom:10px}
.form-err{font-size:13px;color:rgb(var(--danger-rgb));margin:0 0 10px}
.form-err[hidden]{display:none}
.btn{appearance:none;width:100%;min-height:48px;border-radius:13px;border:1px solid var(--stroke);background:rgba(var(--tint),.05);color:var(--text);font-size:15px;font-weight:580;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,rgba(51,112,255,.98),rgba(31,79,214,.98));border-color:rgba(var(--brand-rgb),.5);color:#fff}
.btn.primary:active{background:linear-gradient(180deg,rgba(38,90,224,1),rgba(24,62,170,1))}
.btn:disabled{opacity:.6}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid rgba(var(--tint),.08)}
.kv:first-child{border-top:none;padding-top:0}
.kv-l{font-size:12px;color:var(--muted);flex:0 0 auto;max-width:48%}
.kv-v{font-size:14px;text-align:right;overflow-wrap:anywhere;min-width:0}
.kv-v a{color:var(--text);text-decoration:none;border-bottom:1px dotted rgba(var(--tint),.35)}
details.box>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:24px;font-size:13.5px;font-weight:580}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"▾";color:var(--muted);transition:transform .15s ease}
details.box[open]>summary::after{transform:rotate(180deg)}
.hist-item{border-top:1px solid rgba(var(--tint),.08);padding:10px 0 2px;margin-top:8px}
.hist-date{font-size:12px;color:var(--muted);font-weight:500}
.hist-text{font-size:13.5px;line-height:1.45;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.hist-text b{font-weight:560;color:var(--muted)}

/* Next-customer bar */
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--solid);border-top:1px solid var(--stroke);box-shadow:0 -12px 32px rgba(0,0,0,.35);padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.nextbar[hidden]{display:none}
.nextbar-inner{max-width:520px;margin:0 auto}
.nb-msg{font-size:14px;font-weight:580;color:rgb(var(--ok-rgb))}
.nb-sub{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.nb-sub b{color:var(--text);font-weight:560}
.nb-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px;margin-top:10px}
.nb-actions.single{grid-template-columns:1fr}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 32px);background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.16);color:#fff;padding:10px 16px;border-radius:999px;font-weight:550;font-size:13.5px;box-shadow:0 14px 30px rgba(0,0,0,.4);z-index:200;text-align:center}
.toast[hidden]{display:none}
.toast.lifted{bottom:calc(150px + env(safe-area-inset-bottom))}

/* Käynnistyksen latausnäkymä: peittää sovelluksen kunnes data on haettu ja ensimmäinen render tehty */
body.booting>*:not(#splash){visibility:hidden}
.splash{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  color:rgba(255,255,255,.96);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(900px 620px at 16% 18%, rgba(45,107,255,.24), transparent 60%),
    radial-gradient(760px 580px at 88% 84%, rgba(130,92,246,.14), transparent 62%),
    radial-gradient(620px 420px at 82% 6%, rgba(45,210,220,.08), transparent 60%),
    linear-gradient(180deg,#050b1a,#0a1830);
  opacity:1;transition:opacity .22s ease}
.splash[hidden]{display:none}
.splash.hide{opacity:0;pointer-events:none}
.splash-inner{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.splash-logo{width:64px;height:64px;display:block;object-fit:contain}
.splash-title{font-size:30px;font-weight:720;line-height:1.05;letter-spacing:-.01em}
.splash-sub{font-size:12px;color:rgba(255,255,255,.62);margin-top:4px}
.splash-spinner{width:26px;height:26px;margin-top:10px;border-radius:50%;border:3px solid rgba(45,107,255,.22);border-top-color:#3d7bff;animation:splash-spin .9s linear infinite}
@keyframes splash-spin{to{transform:rotate(360deg)}}
.splash-status{font-size:13px;color:rgba(255,255,255,.68);min-height:18px}
.splash-error{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.splash.is-error .splash-spinner,.splash.is-error .splash-status{display:none}
.splash.is-error .splash-error{display:flex}
.splash-err-title{font-size:16px;font-weight:620}
.splash-err-msg{font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.8);overflow-wrap:anywhere}
.splash-err-detail{font-size:11.5px;line-height:1.4;color:rgba(255,255,255,.5);overflow-wrap:anywhere}
.splash-err-detail:empty{display:none}
.splash-retry{appearance:none;min-height:44px;padding:0 22px;border-radius:13px;border:1px solid rgba(45,107,255,.5);background:linear-gradient(180deg,rgba(51,112,255,.98),rgba(31,79,214,.98));color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;margin-top:4px}
.splash-retry:disabled{opacity:.6;cursor:default}
.splash-err-hint{font-size:12px;color:rgba(255,255,255,.55)}
@media (prefers-reduced-motion:reduce){.splash-spinner{animation-duration:2.4s}.splash{transition:none}}
.hist-del{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;font-weight:500;min-height:40px;min-width:48px;padding:0 10px;margin:2px 0 0 -10px;border-radius:10px;cursor:pointer}
.hist-del:active,.hist-del:focus-visible{color:rgb(var(--danger-rgb));background:rgba(var(--danger-rgb),.08)}
.btn.danger{background:rgba(var(--danger-rgb),.14);border-color:rgba(var(--danger-rgb),.45);color:rgb(var(--danger-rgb))}
.mback{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.mbox{width:min(440px,100%);background:var(--solid);border:1px solid var(--stroke);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px}
.mtitle{font-size:16px;font-weight:620}
.mtext{font-size:14px;line-height:1.5;color:var(--muted)}
.mactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mbox textarea{width:100%;min-height:120px;resize:vertical;border-radius:12px;border:1px solid var(--stroke);background:rgba(var(--tint),.04);color:var(--text);font:inherit;font-size:15px;line-height:1.45;padding:10px 12px}
.msub{font-size:12.5px;color:var(--muted)}

// Paikallinen (ei UTC) YYYY-MM-DD - toISOString() siirtäisi päivää Suomen aikavyöhykkeellä keskiyön tienoilla.
const localISODate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>localISODate(new Date());
const toFI=iso=>iso?new Date(iso+'T00:00:00').toLocaleDateString(LANG==='en'?'en-GB':'fi-FI'):t('noDate');
const addDaysISO=(iso,n)=>{const d=new Date((iso||todayISO())+'T00:00:00');d.setDate(d.getDate()+n);return localISODate(d)};
const daysBetween=(a,b)=>{if(!a||!b)return null;return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)};
const parseNum=v=>{if(v===null||v===undefined||v==='')return 0;const n=Number(String(v).trim().replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:0};
const fmtMoney=n=>parseNum(n).toLocaleString(LANG==='en'?'en-GB':'fi-FI',{maximumFractionDigits:0});
function contactStatus(lastContact){
  const d=lastContact?daysBetween(lastContact,todayISO()):null;
  if(d===null) return {cls:'gray',text:t('noContact')};
  const text=d+' '+t('daysSuffix');
  return {cls:d<=30?'green':d<=60?'yellow':d<=90?'orange':'red',text};
}
function dueInfo(nextDate){
  if(!nextDate) return {cls:'',label:''};
  const t0=todayISO();
  if(nextDate<t0) return {cls:'due-bad',label:t('overdueStatus')};
  if(nextDate===t0) return {cls:'due-today',label:t('todayStatus')};
  return {cls:'',label:''};
}

const emailAddress=c=>c.contact_email||c.email||'';
function mapsUrl(c){ const parts=[c.address,c.city,c.region,c.country].filter(Boolean); return parts.length?'https://www.google.com/maps?q='+encodeURIComponent(parts.join(', ')):''; }

async function workspace(){

// Sivutettu haku ilman kiinteää ylärajaa. Järjestetään id:n mukaan, jotta sivut ovat stabiileja
// (priority/next_date eivät ole uniikkeja -> sivujen väliin voisi jäädä tai tuplautua rivejä).
// Edetään palautetun sivun todellisen koon mukaan ja lopetetaan tyhjään sivuun: näin haku toimii
// oikein myös jos palvelimen max-rows-asetus olisi pienempi kuin PAGE_SIZE.
async function fetchAllRows(table,workspaceId){
  const rows=[],seen=new Set();
  let from=0;
  for(;;){
    const r=await sb.from(table).select('*').eq('workspace_id',workspaceId).is('deleted_at',null).order('id',{ascending:true}).range(from,from+PAGE_SIZE-1);
    if(r.error) throw r.error;
    const page=r.data||[];
    let added=0;
    for(const row of page){ if(!seen.has(row.id)){ seen.add(row.id); rows.push(row); added++; } }
    if(!page.length||!added) break;
    from+=page.length;
  }
  return rows;
}
const noteSortDesc=(a,b)=>(b.note_date||'').localeCompare(a.note_date||'')||(b.created_at||'').localeCompare(a.created_at||'');
const searchText=c=>[c.name,c.city,c.region,c.contact_person,c.owner_name,c.business_id,c.phone,c.contact_phone,c.email,c.contact_email,c.address].map(x=>String(x||'').toLowerCase()).join(' | ');
function indexData(){
  notesByCustomer=new Map();
  for(const n of ns){ if(!notesByCustomer.has(n.customer_id)) notesByCustomer.set(n.customer_id,[]); notesByCustomer.get(n.customer_id).push(n); }
  for(const list of notesByCustomer.values()) list.sort(noteSortDesc);
  searchIndex=new Map(cs.map(c=>[c.id,searchText(c)]));
}
const notesFor=id=>notesByCustomer.get(id)||[];
function addLocalNote(note){
  ns.push(note);
  const list=notesByCustomer.get(note.customer_id)||[];
  list.push(note); list.sort(noteSortDesc);
  notesByCustomer.set(note.customer_id,list);
}
// Myynti lasketaan aina kontakti_notes.sales + note_date -datasta (ei legacy sales_ytd -kentästä).
function ytdSalesFor(id){
  const t0=todayISO(), start=t0.slice(0,4)+'-01-01';
  return notesFor(id).reduce((s,n)=>(n.note_date>=start&&n.note_date<=t0)?s+Number(n.sales||0):s,0);
}

async function fetchData(){
  const w=await workspace();
  const [customers,notes]=await Promise.all([fetchAllRows('kontakti_customers',w.id),fetchAllRows('kontakti_notes',w.id)]);
  cs=customers; ns=notes; indexData(); loaded=true;
  setStatus('');

}
async function load(){

}

const isDue=(c,t0)=>!!c.next_date&&c.next_date<=t0;
function todayList(){
  const t0=todayISO();
  return cs.filter(c=>isDue(c,t0)).sort((a,b)=>((a.priority?0:1)-(b.priority?0:1))||((a.next_date<t0?0:1)-(b.next_date<t0?0:1))||(a.next_date||'').localeCompare(b.next_date||'')||(a.name||'').localeCompare(b.name||'','fi'));
}
function customerList(){
  let arr=cs;
  const q=search.trim().toLowerCase();
  if(q) arr=arr.filter(c=>(searchIndex.get(c.id)||'').includes(q));
  const t0=todayISO();
  if(quickFilter==='overdue') arr=arr.filter(c=>c.next_date&&c.next_date<t0);
  else if(quickFilter==='today') arr=arr.filter(c=>c.next_date===t0);
  else if(quickFilter==='next7'){ const t7=addDaysISO(t0,7); arr=arr.filter(c=>c.next_date&&c.next_date>=t0&&c.next_date<=t7); }
  else if(quickFilter==='priority') arr=arr.filter(c=>c.priority===true);
  return arr.slice().sort((a,b)=>((a.priority?0:1)-(b.priority?0:1))||(a.next_date||'9999-99-99').localeCompare(b.next_date||'9999-99-99')||(a.name||'').localeCompare(b.name||'','fi'));

// valitsema määrä (10 kerrallaan). Ei automaattista latausta scrollauksesta.

function renderList(resetWindow){

  renderedCount=next;

// ── Quick actions (sama logiikka kuin v1) ───────────────────────────────
async function insertNote(row){
  let r=await sb.from('kontakti_notes').insert(row).select().single();
  if(r.error&&row.note_type===null){
    const m=(r.error.message||'').toLowerCase();
    if(m.includes('note_type')||m.includes('null value')) r=await sb.from('kontakti_notes').insert({...row,note_type:'Muu'}).select().single();
  }
  if(r.error) throw r.error;
  return r.data||{...row,id:'local-'+Date.now(),created_at:new Date().toISOString()};
}
async function updateCustomer(c,patch){
  const r=await sb.from('kontakti_customers').update(patch).eq('id',c.id);
  if(r.error) throw r.error;
  Object.assign(c,patch);
}
async function quickAction(id,type,btn){
  const c=cs.find(x=>x.id===id); if(!c) return;
  const group=btn?.closest('.qa'); group?.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    const w=await workspace(); const today=todayISO();
    let msgKey;
    if(type==='answered'){
      const next=addDaysISO(today,90);
      addLocalNote(await insertNote({workspace_id:w.id,customer_id:c.id,note_type:'Soitettu',note_text:'Soitettu.',note_date:today,next_date:next,created_source:SOURCE}));
      await updateCustomer(c,{last_contact:today,next_date:next});
      msgKey='calledToast';
    } else if(type==='missed'){
      const next=addDaysISO(today,1);
      addLocalNote(await insertNote({workspace_id:w.id,customer_id:c.id,note_type:'Ei vastattu',note_text:'Ei vastattu. (soittoyritys)',note_date:today,next_date:next,created_source:SOURCE}));
      await updateCustomer(c,{next_date:next});
      msgKey='noAnswerToast';
    } else {
      await updateCustomer(c,{next_date:addDaysISO(today,1)});
      msgKey='tomorrowToast';
    }
    afterWrite(c,msgKey);
  }catch(e){
    group?.querySelectorAll('button').forEach(b=>b.disabled=false);
    toast(t('genericError',{msg:e.message}));
  }
}
function afterWrite(c,msgKey){
  updateCounts(); renderList(false);
  if(detailId===c.id&&!$('detail').hidden){
    renderDetail(c,{keepForm:false});
    if(detailFromToday){ showNextBar(msgKey); return; }
  }
  toast(t(msgKey));
}

      <div class="qa">
        <button type="button" class="qa-ok" data-qt="answered" data-id="${esc(c.id)}">${esc(t('calledBtn'))}</button>
        <button type="button" class="qa-miss" data-qt="missed" data-id="${esc(c.id)}">${esc(t('noAnswerBtn'))}</button>
        <button type="button" class="qa-snooze" data-qt="snooze" data-id="${esc(c.id)}">${esc(t('tomorrowBtn'))}</button>
      </div>
      <div class="field"><label for="fNote">${esc(t('note'))}</label><textarea id="fNote" placeholder="${esc(t('notePlaceholder'))}"></textarea></div>
      <div class="field"><label for="fPurchases">${esc(t('purchases'))}</label><textarea id="fPurchases" placeholder="${esc(t('purchasesPlaceholder'))}"></textarea></div>
      <div class="grid2">
        <div class="field"><label for="fSales">${esc(t('sales'))}</label><input id="fSales" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="fAction">${esc(t('nextAction'))}</label><select id="fAction">${optHtml}</select></div>
      </div>
      <div class="field"><label for="fNextDate">${esc(t('nextDate'))}</label><input id="fNextDate" type="date" value="${esc(c.next_date||'')}"></div>
      <div class="form-err" id="entryErr" hidden></div>
      <button class="btn primary" id="btnSave" type="button">${esc(t('save'))}</button>
    </section>
    <section class="box">
      <div class="box-title">${esc(t('basicInfo'))}</div>
      ${info}
    </section>
    <details class="box" id="histBox"><summary>${esc(t('history'))} (${notes.length})</summary>${histHtml}</details>
  `;
  writeForm(saved);
  measurePrev();
}
// Pitkä edellinen muistiinpano rajataan ~6 riviin "Näytä kaikki" -napilla. Mitataan vasta kun detail on näkyvissä.
function measurePrev(){
  const body=$('prevBody');
  if(!body||$('detail').hidden) return;
  body.classList.add('collapsed');
  if(body.scrollHeight>body.clientHeight+2) $('prevMore').hidden=false;
  else body.classList.remove('collapsed');
}
async function saveEntry(){
  const c=cs.find(x=>x.id===detailId); if(!c) return;
  const noteText=($('fNote').value||'').trim(), purchasesText=($('fPurchases').value||'').trim();
  const sales=parseNum($('fSales').value);
  const nextAction=$('fAction').value||'Soitto', nextDate=$('fNextDate').value||null;
  const err=$('entryErr'), btn=$('btnSave');
  if(btn.disabled) return;
  const hasPurchase=!!purchasesText||sales>0;
  const actionChanged=nextAction!==(c.next_action||'Soitto'), dateChanged=(nextDate||null)!==(c.next_date||null);
  if(!noteText&&!hasPurchase&&!actionChanged&&!dateChanged){ err.textContent=t('writeNoteOrPurchases'); err.hidden=false; $('fNote').focus(); return; }
  err.hidden=true; btn.disabled=true; btn.textContent=t('saving');
  try{
    const w=await workspace(); const today=todayISO();
    // Merkintärivi vain kun kirjoitettiin muistiinpano tai ostoksia/myyntiä. note_type kuvaa tehdyn merkinnän
    // tyyppiä (null), myynti tallentuu vain kontakti_notes.sales-riville; legacy sales_ytd:tä ei kasvateta.
    if(noteText||hasPurchase){
      const note=await insertNote({workspace_id:w.id,customer_id:c.id,note_type:null,note_text:noteText||null,purchases_text:purchasesText||null,sales:sales||0,note_date:today,next_date:noteText?nextDate:null,created_source:SOURCE});
      addLocalNote(note);
    }
    // Pelkkä ostos ei muuta seuraavaa toimenpidettä; muistiinpano on kontakti (last_contact), pelkkä toimenpiteen muutos ei.
    const patch=noteText?{last_contact:today,next_date:nextDate,next_action:nextAction}
      :(actionChanged||dateChanged)?{next_date:nextDate,next_action:nextAction}:null;
    if(patch) await updateCustomer(c,patch);
    afterWrite(c,'saved');
  }catch(e){
    err.textContent=t('saveError',{msg:e.message}); err.hidden=false;
    btn.disabled=false; btn.textContent=t('save');
  }
}

// ── Viimeisimmän muistiinpanon muokkaus ────────────────────────────────
// Muokattava: aktiivinen, tekstillinen, ei legacy-migraatioriviä eikä pelkkää ostosriviä. Sama rivi päivitetään.
function canEditNote(n){ return !!n&&!!(n.note_text||'').trim()&&n.created_source!==LEGACY_MIGRATION_SOURCE; }
function latestTextNote(customerId){ return notesFor(customerId).find(canEditNote)||null; }
function openEditLatest(){
  const c=cs.find(x=>x.id===detailId); if(!c) return;
  const n=latestTextNote(c.id); if(!n) return;
  closeNoteModal();
  const el=document.createElement('div');
  el.id='noteModal'; el.className='mback';
  el.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
    <div class="mtitle" id="noteModalTitle">${esc(t('editLatest'))}</div>
    <div class="msub">${esc(t('editingNote',{date:toFI(n.note_date)}))}</div>
    <textarea id="editNoteText">${esc(n.note_text||'')}</textarea>
    <div class="form-err" id="noteModalErr" hidden></div>
    <div class="mactions">
      <button type="button" class="btn" id="noteModalCancel">${esc(t('cancelBtn'))}</button>
      <button type="button" class="btn primary" id="noteModalOk">${esc(t('saveChanges'))}</button>
    </div>
  </div>`;
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('#noteModalCancel')){ closeNoteModal(); return; }
    if(e.target.closest('#noteModalOk')) saveEditedNote(c,n);
  });
  document.body.appendChild(el);
  const ta=$('editNoteText'); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
}
async function saveEditedNote(c,n){
  const btn=$('noteModalOk'), err=$('noteModalErr');
  if(!btn||btn.disabled) return;
  if(!canEditNote(n)){ closeNoteModal(); return; }
  const text=($('editNoteText').value||'').trim();
  if(!text){ err.textContent=t('noteEmpty'); err.hidden=false; return; }
  if(text===(n.note_text||'').trim()){ closeNoteModal(); return; }
  btn.disabled=true; btn.textContent=t('saving');
  try{
    const w=await workspace();
    const ur=await sb.from('kontakti_notes').update({note_text:text}).eq('id',n.id).eq('workspace_id',w.id);
    if(ur.error) throw ur.error;
    // RLS voi ohittaa päivityksen hiljaa -> varmistetaan että teksti todella muuttui.
    const chk=await sb.from('kontakti_notes').select('id,note_text').eq('id',n.id).eq('workspace_id',w.id);
    if(chk.error) throw chk.error;
    if(!chk.data||!chk.data.length||chk.data[0].note_text!==text) throw new Error(t('noteUpdateNotApplied'));
    n.note_text=text;
    closeNoteModal();
    if(detailId===c.id&&!$('detail').hidden) renderDetail(c,{keepForm:true});
    toast(t('noteUpdated'));
  }catch(e){
    err.textContent=t('saveError',{msg:e.message}); err.hidden=false;
    btn.disabled=false; btn.textContent=t('saveChanges');
  }
}

// ── Seuraava asiakas ────────────────────────────────────────────────────
// Seuraava haetaan siitä Soita tänään -järjestyksestä, joka oli voimassa kun asiakas avattiin listalta,
// ohittaen asiakkaat joita ei enää tarvitse soittaa tänään. Listan lopusta jatketaan alusta,
// jotta aiemmin ohitetut jäävät kiinni; valmis vasta kun ketään muuta ei ole jäljellä.
function findNextCustomer(){
  const t0=todayISO(), idx=callQueue.indexOf(detailId);
  const order=[...callQueue.slice(idx+1),...callQueue.slice(0,Math.max(idx,0))];
  for(const id of order){ if(id===detailId) continue; const c=cs.find(x=>x.id===id); if(c&&isDue(c,t0)) return c; }
  return null;
}
let nextBarKey=null;
function showNextBar(msgKey){
  nextBarKey=msgKey;
  const next=findNextCustomer();
  $('nextBarInner').innerHTML=`
    <div class="nb-msg">${esc(t(msgKey))}</div>
    <div class="nb-sub">${next?`${esc(t('upNext'))} <b>${esc(next.name||t('unnamed'))}</b>`:esc(t('callListDone'))}</div>
    <div class="nb-actions${next?'':' single'}">
      <button type="button" class="btn" id="nbBack">${esc(t('backToList'))}</button>
      ${next?`<button type="button" class="btn primary" id="nbNext" data-id="${esc(next.id)}">${esc(t('nextCustomer'))}</button>`:''}
    </div>`;
  $('nextBar').hidden=false;
}
function hideNextBar(){ $('nextBar').hidden=true; }

// ── Wiring ──────────────────────────────────────────────────────────────
function setLang(lang){
  LANG=lang==='en'?'en':'fi'; lsSet(LS_LANG,LANG);
  applyStaticI18n(); updateLangUI(); renderAll(false);
  const c=detailId&&cs.find(x=>x.id===detailId);
  if(c) renderDetail(c,{keepForm:true});
  if(!$('nextBar').hidden&&nextBarKey) showNextBar(nextBarKey);
}
function setView(v){ if(v===view) return; view=v; renderAll(true); window.scrollTo(0,0); }
let searchT=null;

// ── Yksittäisen merkinnän poisto (soft delete) ─────────────────────────
// Vain deleted_at asetetaan; rivi säilyy kannassa. Kaikki myyntiluvut lasketaan aktiivisista noteista,
// joten poistettu summa poistuu niistä automaattisesti. customers.sales_ytd:hen ei kosketa.
// Legacy-myynnin migraatiorivejä ei voi poistaa käyttöliittymästä.
const LEGACY_MIGRATION_SOURCE='legacy_sales_migration_2026';
const canDeleteNote=n=>!!n&&n.created_source!==LEGACY_MIGRATION_SOURCE;
function fmtAmount(v){
  const n=parseNum(v), o={minimumFractionDigits:2,maximumFractionDigits:2};
  return LANG==='en'?'€'+n.toLocaleString('en-GB',o):n.toLocaleString('fi-FI',o)+' €';
}
async function softDeleteNote(n){
  if(!canDeleteNote(n)) throw new Error(t('noteDeleteNotApplied'));
  const w=await workspace();
  const ur=await sb.from('kontakti_notes').update({deleted_at:new Date().toISOString()}).eq('id',n.id).eq('workspace_id',w.id);
  if(ur.error) throw ur.error;
  // RLS voi ohittaa päivityksen hiljaa (0 riviä ilman virhettä) -> varmistetaan ettei merkintä ole enää aktiivinen.
  const chk=await sb.from('kontakti_notes').select('id').eq('id',n.id).eq('workspace_id',w.id).is('deleted_at',null);
  if(chk.error) throw chk.error;
  if(chk.data&&chk.data.length) throw new Error(t('noteDeleteNotApplied'));
}
function closeNoteModal(){ $('noteModal')?.remove(); }
function confirmDeleteNote(id){
  const n=ns.find(x=>x.id===id); if(!canDeleteNote(n)) return;
  closeNoteModal();
  const sales=parseNum(n.sales);
  const el=document.createElement('div');
  el.id='noteModal'; el.className='mback';
  el.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
    <div class="mtitle" id="noteModalTitle">${esc(t('deleteNoteTitle'))}</div>
    ${sales>0?`<div class="mtext">${esc(t('deleteNoteSales',{amount:fmtAmount(sales)}))}<br>${esc(t('deleteNoteSalesEffect'))}</div>`:''}
    <div class="form-err" id="noteModalErr" hidden></div>
    <div class="mactions">
      <button type="button" class="btn" id="noteModalCancel">${esc(t('cancelBtn'))}</button>
      <button type="button" class="btn danger" id="noteModalOk">${esc(t('deleteNote'))}</button>
    </div>
  </div>`;
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('#noteModalCancel')){ closeNoteModal(); return; }
    if(e.target.closest('#noteModalOk')) deleteNote(n);
  });
  document.body.appendChild(el);
  $('noteModalCancel').focus();
}
async function deleteNote(n){
  const btn=$('noteModalOk'), err=$('noteModalErr');
  if(btn){ btn.disabled=true; btn.textContent=t('deleting'); }
  try{
    await softDeleteNote(n);
    ns=ns.filter(x=>x.id!==n.id); indexData();
    closeNoteModal();
    updateCounts(); renderList(false);
    const c=cs.find(x=>x.id===n.customer_id);
    if(c&&detailId===c.id&&!$('detail').hidden){ renderDetail(c,{keepForm:true}); const hb=$('histBox'); if(hb) hb.open=true; }
    toast(t('noteDeleted'));
  }catch(e){
    if(err){ err.hidden=false; err.textContent=t('noteDeleteFailed',{msg:e.message}); }
    if(btn){ btn.disabled=false; btn.textContent=t('deleteNote'); }
  }
}

function wire(){
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  $('search').addEventListener('input',e=>{
    clearTimeout(searchT);
    searchT=setTimeout(()=>{ search=e.target.value||''; $('searchClear').hidden=!search; renderList(true); window.scrollTo(0,0); },120);
  });
  $('searchClear').addEventListener('click',()=>{ $('search').value=''; search=''; $('searchClear').hidden=true; renderList(true); $('search').focus(); });
  document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{
    quickFilter=quickFilter===b.dataset.f?'':b.dataset.f;
    document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x.dataset.f===quickFilter));
    renderList(true); window.scrollTo(0,0);
  }));
  $('btnRefresh').addEventListener('click',load);
  $('btnBack').addEventListener('click',()=>closeDetail(false));
  $('btnSignOut').addEventListener('click',async()=>{ try{ await sb.auth.signOut(); }catch(e){} window.location.href=DESKTOP_LOGIN; });
  document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

  $('list').addEventListener('click',e=>{
    const qa=e.target.closest('[data-qt]');
    if(qa){ e.stopPropagation(); quickAction(qa.dataset.id,qa.dataset.qt,qa); return; }
    const card=e.target.closest('.card');
    if(card) openDetail(card.dataset.id,{fromToday:view==='today'});
  });
  $('list').addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const card=e.target.closest('.card');
    if(card&&e.target===card) openDetail(card.dataset.id,{fromToday:view==='today'});
  });
  $('dBody').addEventListener('click',e=>{
    const qa=e.target.closest('[data-qt]');
    if(qa){ quickAction(qa.dataset.id,qa.dataset.qt,qa); return; }
    if(e.target.closest('#btnSave')){ saveEntry(); return; }
    if(e.target.closest('#btnEditLatest')){ openEditLatest(); return; }
    const del=e.target.closest('[data-del]');
    if(del){ confirmDeleteNote(del.dataset.del); return; }
    if(e.target.closest('#prevMore')){
      const body=$('prevBody'), collapsed=body.classList.toggle('collapsed');
      $('prevMore').textContent=collapsed?t('showAll'):t('showLess');
    }
  });
  $('nextBar').addEventListener('click',e=>{
    if(e.target.closest('#nbBack')){ closeDetail(false); return; }
    const nx=e.target.closest('#nbNext');
    if(nx) openDetail(nx.dataset.id,{fromToday:true,keepQueue:true});
  });
  window.addEventListener('popstate',()=>{ if(!$('detail').hidden) closeDetail(true); });

  $('btnMore').addEventListener('click',showMore);
}


// ── Käynnistys ──────────────────────────────────────────────────────────
// Splash peittää sovelluksen, kunnes auth on tarkistettu, workspace + asiakkaat + kaikki merkinnät on haettu
// (fetchAllRows), indeksit rakennettu ja ensimmäinen render tehty. Virheessä splash vaihtuu virhetilaan
// eikä keskeneräistä sovellusta näytetä. Ei automaattista uudelleenyritystä.
const SPLASH_MIN_MS=350;
const splashT0=typeof window.__splashT0==='number'?window.__splashT0:performance.now();
let bootRunning=false;
function splashShowLoading(){
  const s=$('splash'); if(!s) return;
  s.hidden=false; s.classList.remove('is-error','hide');
  $('splashStatus').textContent=t('splashLoading');
}
function splashShowError(e){
  console.error('[Kontakti] käynnistys epäonnistui',e);
  const s=$('splash'); if(!s) return;
  const msg=String((e&&e.message)||e||'');
  const network=(e&&e.name==='AuthRetryableFetchError')||/failed to fetch|networkerror|load failed|network request failed/i.test(msg);
  $('splashErrTitle').textContent=t('splashErrorTitle');
  $('splashErrMsg').textContent=network?t('splashErrNetwork'):t('splashErrGeneric');
  $('splashErrDetail').textContent=network?'':msg.split('\n')[0].slice(0,160);
  $('splashRetry').textContent=t('splashRetry');
  $('splashErrHint').textContent=t('splashErrorHint');
  document.body.classList.add('booting');
  s.hidden=false; s.classList.remove('hide'); s.classList.add('is-error');
  $('splashRetry').disabled=false; $('splashRetry').focus();
}
async function hideSplash(){
  const wait=SPLASH_MIN_MS-(performance.now()-splashT0);
  if(wait>0) await new Promise(r=>setTimeout(r,wait));
  const s=$('splash');
  document.body.classList.remove('booting');
  if(!s) return;
  s.classList.add('hide');
  setTimeout(()=>{ if(s.classList.contains('hide')){ s.hidden=true; s.classList.remove('hide'); } },260);
}
// Ei istuntoa -> login. Verkko-/palvelinvirhe -> virhetila (ei turhaa ohjausta loginiin).
async function bootAuth(){
  const r=await sb.auth.getUser();
  const err=r&&r.error;
  if(err&&(err.name==='AuthRetryableFetchError'||err.status===0||(err.status||0)>=500)) throw err;
  user=(r&&r.data&&r.data.user)||null;
  return user;
}
async function boot(){
  if(bootRunning) return;
  bootRunning=true; $('splashRetry').disabled=true;
  splashShowLoading();
  try{
    await bootAuth();
    if(!user){ window.location.href=DESKTOP_LOGIN; return; }   // splash pysyy näkyvissä ohjaukseen asti
    $('userEmail').textContent=user.email||'';
    $('foot').hidden=false;
    await fetchData();

    await hideSplash();
  }catch(e){ splashShowError(e); }
  finally{ bootRunning=false; $('splashRetry').disabled=false; }
}

async function init(){
  try{
    applyTheme(); applyStaticI18n(); updateLangUI(); wire();
    if(history.state&&history.state.detail) history.replaceState(null,'');
    renderAll(true);
    $('splashRetry').addEventListener('click',boot);
  }catch(e){ splashShowError(e); return; }
  await boot();
}
init();
</script>
</body>
</html>
