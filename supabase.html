<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kontakti Mobile · Supabase</title><style>:root{--bg:#040a15;--card:#0d1b2f;--line:rgba(145,180,255,.18);--text:#eef4ff;--muted:#9db0d3;--blue:#4e9eff;--green:#35d48d;--red:#ff5f7a;--purple:#9f6bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.phone{max-width:430px;margin:auto;min-height:100vh;background:#071226;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:24px;font-weight:900}.card{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:14px;margin:10px 0}.btn,input,textarea,select{font:inherit}.btn{border:1px solid rgba(78,158,255,.35);background:rgba(78,158,255,.16);color:var(--text);border-radius:13px;padding:10px 12px;font-weight:800;cursor:pointer}.btn.full{width:100%}.btn.green{background:rgba(53,212,141,.14);border-color:rgba(53,212,141,.28)}input,textarea,select{width:100%;border:1px solid rgba(190,215,255,.28);background:#06101f;color:#fff;border-radius:13px;padding:11px;margin:6px 0 10px}textarea{min-height:86px}.muted{color:var(--muted)}.ok{color:#b9f6d4}.err{color:#ffc0c0}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(255,255,255,.035)}.name{font-weight:900}.badge{display:inline-block;font-size:11px;border-radius:999px;padding:4px 7px;margin-left:5px}.prio{background:rgba(159,107,255,.18);color:#ddcaff}.meet{background:rgba(53,212,141,.14);color:#b9f6d4}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px}</style></head><body><main class="phone"><div class="top"><div><div class="muted small">Opero · Kontakti</div><div class="title">Mobile Supabase</div></div><button class="btn" id="refresh">↻</button></div><div class="card"><b>Kirjautuminen</b><div class="row"><input id="email" placeholder="sähköposti"><input id="password" type="password" placeholder="salasana"></div><button class="btn" id="signin">Kirjaudu</button> <button class="btn" id="signout">Ulos</button><p id="auth" class="muted">Tarkistetaan...</p></div><div class="card"><b>Uusi asiakas</b><input id="newName" placeholder="Asiakkaan nimi"><input id="newPhone" placeholder="Puhelin"><input id="newAddress" placeholder="Osoite"><button class="btn green full" id="addCustomer">Lisää pilveen</button><p id="addStatus" class="muted"></p></div><div class="card"><b>Asiakkaat</b><input id="search" placeholder="Hae"><div id="customers" class="list"></div></div><div class="card"><b>Merkintä</b><div id="selected" class="muted">Valitse asiakas listalta.</div><select id="noteType"><option>Soitto</option><option>Tapaaminen</option><option>Sähköposti</option><option>Seuranta</option></select><textarea id="noteText" placeholder="Merkintä"></textarea><div class="row"><select id="nextAction"><option>Soitto</option><option>Tapaaminen</option><option>Sähköposti</option><option>Seuranta</option></select><input id="nextDate" type="date"></div><div class="row"><select id="priority"><option value="0">Ei priority</option><option value="1">Priority</option></select><select id="meeting"><option value="0">Ei tapaamista</option><option value="1">Tapaaminen</option></select></div><button class="btn green full" id="saveNote">Tallenna merkintä pilveen</button><p id="saveStatus" class="muted"></p></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://miahuckcphquawobehtk.supabase.co','sb_publishable_tY1y97VnFfhXyKJ_9XCNGw_-rEq2pLx');let user=null,workspace=null,customers=[],selected=null;const $=id=>document.getElementById(id);function msg(id,t,c='muted'){$(id).className=c;$(id).textContent=t}function e(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function auth(){const{data}=await sb.auth.getUser();user=data?.user||null;msg('auth',user?'Kirjautunut: '+user.email:'Ei kirjautunut',user?'ok':'muted');return user}async function ws(){if(workspace)return workspace;if(!await auth())throw Error('Kirjaudu ensin');let r=await sb.from('kontakti_workspaces').select('*').limit(1);if(r.error)throw r.error;if(r.data?.length)workspace=r.data[0];else{let n=await sb.from('kontakti_workspaces').insert({name:'Kontakti',owner_id:user.id}).select().single();if(n.error)throw n.error;workspace=n.data}return workspace}async function load(){try{let w=await ws();let r=await sb.from('kontakti_customers').select('*').eq('workspace_id',w.id).is('deleted_at',null).order('priority',{ascending:false}).order('next_date',{ascending:true,nullsFirst:false}).limit(200);if(r.error)throw r.error;customers=r.data||[];render()}catch(x){$('customers').innerHTML='<div class="err">'+e(x.message)+'</div>'}}function render(){const q=$('search').value.toLowerCase();const list=customers.filter(c=>[c.name,c.city,c.phone,c.address].join(' ').toLowerCase().includes(q));$('customers').innerHTML=list.map(c=>`<div class="item"><div class="name">${e(c.name)} ${c.priority?'<span class="badge prio">Priority</span>':''}${c.meeting?'<span class="badge meet">Tapaaminen</span>':''}</div><div class="small muted">${e(c.next_date||'ei päivää')} · ${e(c.next_action||'')}</div><div class="row" style="margin-top:8px"><button class="btn" onclick="selectCustomer('${c.id}')">Valitse</button>${c.phone?`<a class="btn" href="tel:${e(c.phone)}">Soita</a>`:''}</div></div>`).join('')||'<div class="muted">Ei asiakkaita.</div>'}window.selectCustomer=id=>{selected=customers.find(c=>c.id===id);$('selected').innerHTML=selected?'<b>'+e(selected.name)+'</b>':'Valitse asiakas';if(selected){$('nextAction').value=selected.next_action||'Soitto';$('nextDate').value=selected.next_date||'';$('priority').value=selected.priority?'1':'0';$('meeting').value=selected.meeting?'1':'0'}};$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return msg('auth','Virhe: '+r.error.message,'err');workspace=null;await auth();await load()};$('signout').onclick=async()=>{await sb.auth.signOut();user=null;workspace=null;customers=[];selected=null;render();await auth()};$('addCustomer').onclick=async()=>{try{let w=await ws();let n=$('newName').value.trim();if(!n)throw Error('Nimi puuttuu');let r=await sb.from('kontakti_customers').insert({workspace_id:w.id,name:n,phone:$('newPhone').value,address:$('newAddress').value,next_action:'Soitto',created_source:'mobile-supabase'}).select().single();if(r.error)throw r.error;msg('addStatus','Lisätty pilveen: '+r.data.name,'ok');$('newName').value='';$('newPhone').value='';$('newAddress').value='';await load()}catch(x){msg('addStatus','Virhe: '+x.message,'err')}};$('saveNote').onclick=async()=>{try{if(!selected)throw Error('Valitse asiakas');let w=await ws();let patch={next_action:$('nextAction').value,next_date:$('nextDate').value||null,priority:$('priority').value==='1',meeting:$('meeting').value==='1',done:true,last_contact:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()};let u=await sb.from('kontakti_customers').update(patch).eq('id',selected.id).select().single();if(u.error)throw u.error;let note={workspace_id:w.id,customer_id:selected.id,note_type:$('noteType').value,note_text:$('noteText').value||$('noteType').value,note_date:new Date().toISOString().slice(0,10),next_date:patch.next_date,created_source:'mobile-supabase'};let nr=await sb.from('kontakti_notes').insert(note);if(nr.error)throw nr.error;msg('saveStatus','Tallennettu pilveen','ok');$('noteText').value='';await load();selectCustomer(selected.id)}catch(x){msg('saveStatus','Virhe: '+x.message,'err')}};$('refresh').onclick=load;$('search').oninput=render;await auth();if(user)await load();</script></body></html>
